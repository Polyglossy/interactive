name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - '.config/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'assets/**'
      - 'docs/**'
      - 'images/**'
      - '.editorconfig'
      - '.gitignore'
      - '*.txt'
      - '*.github-issues'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - '.config/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'assets/**'
      - 'docs/**'
      - 'images/**'
      - '.editorconfig'
      - '.gitignore'
      - '*.txt'
      - '*.github-issues'
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: 'Pre-release version label (e.g., alpha, beta, rc). Leave empty for release version.'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc
          - preview
          - ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  DOTNET_INTERACTIVE_FRONTEND_NAME: CI
  DOTNET_INTERACTIVE_SIGN_TYPE: Test

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    permissions:
      contents: read
      checks: write   # required by dorny/test-reporter (inside composite action)
    steps:
      - name: Configure git symlinks and long paths (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
        shell: pwsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/build-and-test
        with:
          prerelease-label: ${{ github.event.inputs.prerelease-label }}

      # ... rest of steps remain the same ...